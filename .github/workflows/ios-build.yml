name: iOS Build (Simulator)

# Build sob demanda, e opcionalmente em toda push na main.
# Build de simulador não precisa de certificado/provisioning profile — ideal
# para Appetize.io ou testes locais em qualquer Mac, sem custo de conta
# Apple Developer (o TEAM_ID no Config.xcconfig já está vazio, confirmando
# que o projeto não assina builds hoje).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build .app for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kotlin 2.3.20 / Compose Multiplatform 1.11.1 são versões recentes e
      # normalmente exigem toolchain de linker de uma versão de Xcode também
      # recente. Em vez de fixar um número (que trava e desatualiza), pega
      # dinamicamente a versão mais alta já instalada no runner.
      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "::error::Nenhum Xcode encontrado em /Applications"
            exit 1
          fi
          echo "Selecionando: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Fail-fast: se o framework Kotlin/Native não compilar, falha aqui com
      # o log completo do Gradle, muito mais legível que um erro genérico
      # do xcodebuild mais adiante. O Xcode chamaria essa mesma task de
      # qualquer forma via Run Script Build Phase durante o build abaixo.
      #
      # Só existe target iosSimulatorArm64 (sem iosX64) no shared/build.gradle.kts,
      # então arm64 é a única arquitetura de simulador válida — e é justamente
      # a nativa dos runners macos-15 (Apple Silicon), sem overhead de Rosetta.
      - name: Build & embed Kotlin framework (Simulator arm64)
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        env:
          CONFIGURATION: Debug
          SDK_NAME: iphonesimulator
          ARCHS: arm64

      - name: Build iOS app for Simulator
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Locate and package the .app bundle
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Nenhum .app encontrado em DerivedData"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2
            exit 1
          fi
          echo "Encontrado: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/output"
          # Appetize e a maioria dos simuladores esperam um .zip do .app
          # diretamente na raiz — ditto preserva a estrutura do bundle
          # (recomendação oficial da Apple, ao contrário do `zip` comum).
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/output/ForgeFocus-ios-simulator.zip"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeFocus-ios-simulator
          path: ${{ runner.temp }}/output/ForgeFocus-ios-simulator.zip
          retention-days: 14