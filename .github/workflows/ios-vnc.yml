name: iOS Build e Screenshots

on:
  workflow_dispatch:

jobs:
  ios-live:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-konan-

      - name: Permissão Gradle
        run: chmod +x gradlew

      # Compila o Kotlin para o simulador iOS (Apple Silicon)
      - name: Build Kotlin iOS Framework
        run: |
          ./gradlew :shared:compileKotlinIosSimulatorArm64

      # Descobre um simulador de iPhone disponível nesse runner
      - name: Descobrir Simulator Disponível
        run: |
          xcrun simctl list devices available

          DEVICE_NAME=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['name'])
                      sys.exit(0)
          ")

          if [ -z "$DEVICE_NAME" ]; then
            echo "Nenhum simulador de iPhone disponível encontrado."
            exit 1
          fi

          echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "Usando device: $DEVICE_NAME"

      # Compila o aplicativo iOS para o Simulator
      - name: Build .app para Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME}" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      # Instala o Maestro CLI diretamente no runner
      - name: Setup Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verificar Maestro
        run: |
          maestro --version

      # Inicia o Simulator e instala o aplicativo
      - name: Iniciar Simulator e Instalar App
        run: |
          UDID=$(xcrun simctl list devices available | grep "$DEVICE_NAME" | head -1 | grep -oE '[A-F0-9-]{36}')
          
          if [ -z "$UDID" ]; then
            echo "Nenhum simulador '$DEVICE_NAME' encontrado."
            xcrun simctl list devices available
            exit 1
          fi
          
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Usando Simulator: $UDID"
          
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          
          APP_PATH=$(find build/ios -name "*.app" -not -path "*/Intermediates*" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Nenhum arquivo .app encontrado."
            find build/ios -type d -name "*.app"
            exit 1
          fi
          
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Instalando: $APP_PATH"
          
          xcrun simctl install "$UDID" "$APP_PATH"

      # Cria o Flow do Maestro
      - name: Criar Flow do Maestro
        run: |
          mkdir -p .maestro
          
          cat > .maestro/screenshots.yaml << 'EOF'
          appId: com.app.forgefocus
          ---
          - launchApp
          - takeScreenshot: screenshot_1_home
          
          - swipe:
              start: 90%, 50%
              end: 10%, 50%
          
          - takeScreenshot: screenshot_2_swipe
          
          - tapOn:
              point: 50%, 50%
          
          - takeScreenshot: screenshot_3_detail
          
          - swipe:
              start: 50%, 70%
              end: 50%, 30%
          
          - takeScreenshot: screenshot_4_scroll
          EOF

      # Executa o Flow
      - name: Rodar Flow do Maestro
        run: |
          maestro test .maestro/screenshots.yaml

      # Copia os screenshots para o workspace
      - name: Copiar Screenshots pro Workspace
        run: |
          mkdir -p screenshots
          
          find ~/.maestro/tests -name "*.png" \
            -exec cp {} screenshots/ \; 2>/dev/null || true
          
          find . -maxdepth 3 -name "*.png" \
            -not -path "./screenshots/*" \
            -exec cp {} screenshots/ \; 2>/dev/null || true
          
          echo "Screenshots encontrados:"
          ls -la screenshots/

      # Salva os screenshots como Artifact
      - name: Salvar Screenshots como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: error